name: Lint by RuboCop

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Setup mise
        uses: jdx/mise-action@v2
      -
        name: RuboCop
        run: mise run rubocop
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Setup mise
        uses: jdx/mise-action@v2
      -
        name: Ruby tests
        run: mise run test
