services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 AS markdownlint
        RUN npm install -g markdownlint-cli2@0.22.1 --no-fund --no-audit
        FROM ruby:3.4.10-slim-bookworm@sha256:514336e7d46dd52b94a7391e4bc34dc04dc83098963c2c2493b90354952acd78
        WORKDIR /app
        COPY --from=markdownlint /usr/local/bin/node /usr/local/bin/node
        COPY --from=markdownlint /usr/local/bin/markdownlint-cli2 /usr/local/bin/markdownlint-cli2
        COPY --from=markdownlint /usr/local/lib/node_modules /usr/local/lib/node_modules
        RUN apt-get update && apt-get install -y \
                build-essential=12.9 \
                openssh-client=1:9.2p1-2+deb12u10 \
            && \
            gem install ast -v 2.4.3 --no-document && \
            gem install json -v 2.21.2 --no-document && \
            gem install language_server-protocol -v 3.17.0.6 --no-document && \
            gem install lint_roller -v 1.1.0 --no-document && \
            gem install parallel -v 2.1.0 --no-document && \
            gem install parser -v 3.3.12.0 --no-document && \
            gem install prism -v 1.9.0 --no-document && \
            gem install racc -v 1.8.1 --no-document && \
            gem install rainbow -v 3.1.1 --no-document && \
            gem install regexp_parser -v 2.12.0 --no-document && \
            gem install rubocop-ast -v 1.50.0 --no-document && \
            gem install ruby-progressbar -v 1.13.0 --no-document && \
            gem install unicode-emoji -v 4.2.0 --no-document && \
            gem install unicode-display_width -v 3.2.0 --no-document && \
            gem install rubocop -v 1.89.0 --no-document && \
            apt-get clean && \
            rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
        CMD []
    depends_on:
      googlecloud:
        condition: service_healthy
    environment:
      TASK_GOOGLECLOUD_IN_CONTAINER: "1"
    volumes:
      - .:/app
      - googlecloud-ssh:/run/googlecloud-ssh:ro
  googlecloud:
    build:
      context: .
      dockerfile_inline: |
        FROM --platform=linux/x86_64 gcr.io/google.com/cloudsdktool/google-cloud-cli:489.0.0@sha256:1fe16aa77fac9463b8b8ec3a5ebf1e5a02f0ce6afc67a5bf63055f0c6f855892
        WORKDIR /uploads
        RUN apt-get update && apt-get install -y \
                openssh-server=1:8.4p1-5+deb11u7 \
                netcat-openbsd=1.217-3 \
            && \
            useradd --create-home --shell /bin/bash cloud && \
            mkdir /var/run/sshd && \
            mkdir -p /etc/ssh/sshd_config.d && \
            printf '%s\n' \
                'PermitRootLogin no' \
                'PasswordAuthentication no' \
                'KbdInteractiveAuthentication no' \
                'PubkeyAuthentication yes' \
                'AllowUsers cloud' \
                > /etc/ssh/sshd_config.d/00-googlecloud-security.conf && \
            sed -i '1i Include /etc/ssh/sshd_config.d/00-googlecloud-security.conf' /etc/ssh/sshd_config && \
            apt-get clean && \
            rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
        COPY docker/googlecloud-entrypoint.sh /usr/local/bin/googlecloud-entrypoint
        RUN chmod 755 /usr/local/bin/googlecloud-entrypoint
        EXPOSE 22
        ENTRYPOINT ["/usr/local/bin/googlecloud-entrypoint"]
    volumes:
      - .:/app
      - googlecloud-ssh:/run/googlecloud-ssh
    healthcheck:
      test: ["CMD-SHELL", "sshd -T | grep -q '^permitrootlogin no$' && sshd -T | grep -q '^passwordauthentication no$' && nc -z 127.0.0.1 22 && test -s /run/googlecloud-ssh/client_key && test -s /run/googlecloud-ssh/known_hosts"]

volumes:
  googlecloud-ssh:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=0700
