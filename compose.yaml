services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 AS markdownlint

        RUN npm install -g markdownlint-cli2@0.22.1 --no-fund --no-audit

        FROM rust:1.89.0-slim-bookworm@sha256:d7fc7de78bb8c1469933aeecbf801314d30d7d6e9f0578bba4cfa285bfa37fe6

        WORKDIR /app

        COPY Cargo.toml Cargo.lock ./

        RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates \
                git \
                openssh-client \
                shellcheck \
            && \
            rustup component add clippy rustfmt \
            && \
            cargo install cargo-audit --version 0.22.2 --locked \
            && \
            cargo install cargo-deny --version 0.20.2 --locked \
            && \
            apt-get clean \
            && \
            rm -rf /var/lib/apt/lists/*

        # Keep source changes out of the tool preparation layer so Docker can reuse
        # the pinned toolchain and audit/lint installations across application builds.
        COPY src ./src

        RUN cargo build --release --locked \
            && \
            install -m 755 target/release/task-googlecloud /usr/local/bin/task-googlecloud

        COPY --from=markdownlint /usr/local/bin/node /usr/local/bin/node
        COPY --from=markdownlint /usr/local/lib/node_modules /usr/local/lib/node_modules

        RUN ln -s ../lib/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs /usr/local/bin/markdownlint-cli2

        CMD []
    depends_on:
      googlecloud:
        condition: service_healthy
    volumes:
      - .:/app
      - googlecloud-ssh:/run/googlecloud-ssh:ro
  googlecloud:
    build:
      context: .
      dockerfile_inline: |
        # Keep one reproducible CLI release while allowing Docker to select the host architecture.
        FROM gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-stable@sha256:f5fae73a6f1c60b58a1150ff76771a43620891d4dd74abc527c8eca0d544b385
        WORKDIR /uploads
        RUN apt-get update && apt-get install -y \
                openssh-server=1:10.0p1-7+deb13u4 \
                netcat-openbsd=1.229-1 \
            && \
            useradd --create-home --shell /bin/bash cloud && \
            mkdir -p /var/run/sshd && \
            mkdir -p /etc/ssh/sshd_config.d && \
            printf '%s\n' \
                'PermitRootLogin no' \
                'PasswordAuthentication no' \
                'KbdInteractiveAuthentication no' \
                'PubkeyAuthentication yes' \
                'AllowUsers cloud' \
                > /etc/ssh/sshd_config.d/00-googlecloud-security.conf && \
            sed -i '1i Include /etc/ssh/sshd_config.d/00-googlecloud-security.conf' /etc/ssh/sshd_config && \
            apt-get clean && \
            rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
        # Login shells reset PATH, so keep gcloud available to the SSH user.
        RUN printf '%s\n' 'export PATH="$$PATH:/usr/lib/google-cloud-sdk/bin"' > /etc/profile.d/google-cloud-sdk.sh
        # SSH command sessions use a minimal PATH, so expose gcloud in a standard directory.
        RUN ln -s /usr/lib/google-cloud-sdk/bin/gcloud /usr/local/bin/gcloud
        RUN cat <<'EOF' > /usr/local/bin/googlecloud-entrypoint
        #!/bin/sh
        set -eu

        ssh_key_dir=/run/googlecloud-ssh

        install -d -m 700 "$$ssh_key_dir"
        rm -f "$$ssh_key_dir/client_key" "$$ssh_key_dir/client_key.pub" "$$ssh_key_dir/known_hosts"
        ssh-keygen -A
        ssh-keygen -q -t ed25519 -N "" -f "$$ssh_key_dir/client_key"

        known_hosts="$$ssh_key_dir/known_hosts"
        : > "$$known_hosts"
        for host_key in /etc/ssh/ssh_host_*_key.pub; do
          [ -f "$$host_key" ] || continue
          printf 'googlecloud %s\n' "$$(cat "$$host_key")" >> "$$known_hosts"
        done
        chmod 644 "$$known_hosts"

        install -d -m 700 -o cloud -g cloud /home/cloud/.ssh
        install -m 600 -o cloud -g cloud "$$ssh_key_dir/client_key.pub" /home/cloud/.ssh/authorized_keys

        # Keep signal-aware PID 1 and isolate sshd so interrupts stop the server tree.
        setsid /usr/sbin/sshd -D -e &
        sshd_pid=$$!

        stop_sshd_descendants() {
          for child_pid in $$(pgrep -P "$$1" 2>/dev/null || true); do
            stop_sshd_descendants "$$child_pid"
            kill -TERM "$$child_pid" 2>/dev/null || true
          done
        }

        stop_sshd() {
          stop_sshd_descendants "$$sshd_pid"
          kill -TERM "-$$sshd_pid" 2>/dev/null || true
          wait "$$sshd_pid" 2>/dev/null || true
        }

        trap 'stop_sshd; exit 130' INT
        trap 'stop_sshd; exit 143' TERM

        wait "$$sshd_pid"
        EOF
        RUN chmod 755 /usr/local/bin/googlecloud-entrypoint
        EXPOSE 22
        ENTRYPOINT ["/usr/local/bin/googlecloud-entrypoint"]
    volumes:
      - googlecloud-ssh:/run/googlecloud-ssh
    healthcheck:
      test: ["CMD-SHELL", "sshd -T | grep -q '^permitrootlogin no$' && sshd -T | grep -q '^passwordauthentication no$' && nc -z 127.0.0.1 22 && test -s /run/googlecloud-ssh/client_key && test -s /run/googlecloud-ssh/known_hosts"]

volumes:
  googlecloud-ssh:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=0700
