[tasks.normalize]
description = "Normalize files of Cloud storage"
usage = '''
arg "<project>" help="Google Cloud project"
arg "<bucket>" help="Cloud Storage bucket"
'''
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    ruby bin/normalize "${usage_project?}" "${usage_bucket?}"
else
    trap 'docker compose down' EXIT
    docker compose build
    docker compose run --rm -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app ruby bin/normalize "${usage_project?}" "${usage_bucket?}"
fi
'''

[tasks.upload]
description = "Upload files to Cloud storage"
usage = '''
arg "<project>" help="Google Cloud project"
'''
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    ruby bin/upload "${usage_project?}"
else
    trap 'docker compose down' EXIT
    docker compose build
    docker compose run --rm -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app ruby bin/upload "${usage_project?}"
fi
'''

[tasks.logout]
description = "Logout from Google Cloud"
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    ruby bin/logout
else
    trap 'docker compose down' EXIT
    docker compose build
    docker compose run --rm -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app ruby bin/logout
fi
'''

[tasks.fix]
description = "Run RuboCop autocorrect with the configured Ruby version"
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    rubocop --debug --autocorrect-all
else
    docker compose build app
    docker compose run --rm --no-deps -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app rubocop --debug --autocorrect-all
fi
'''

[tasks.rubocop]
description = "Run RuboCop lint with the configured Ruby version"
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    rubocop --debug --extra-details
else
    docker compose build app
    docker compose run --rm --no-deps -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app rubocop --debug --extra-details
fi
'''

[tasks.markdownlint]
description = "Run markdownlint-cli2"
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    markdownlint-cli2 --config .markdownlint-cli2.jsonc
else
    docker compose build app
    docker compose run --rm --no-deps -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app markdownlint-cli2 --config .markdownlint-cli2.jsonc
fi
'''

[tasks.test]
description = "Run Ruby tests"
run = '''
set -eu
if [ "${TASK_GOOGLECLOUD_IN_CONTAINER:-}" = "1" ] || [ -f /.dockerenv ]; then
    ruby -Ilib -e 'Dir["tests/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
else
    docker compose build app
    docker compose run --rm --no-deps -e TASK_GOOGLECLOUD_IN_CONTAINER=1 app ruby -Ilib -e 'Dir["tests/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
fi
'''
