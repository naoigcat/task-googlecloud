[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# These versions are retained because the current Rustls and ICU dependency
# trees require incompatible major versions of the same foundational crates.
# Revisit each exception when its dependency chain changes so new duplicates do
# not become hidden by an outdated version-specific skip.
skip = [
    { crate = "getrandom@0.2.17", reason = "ring 0.17.14, used by reqwest's Rustls provider, requires the getrandom 0.2 API" },
    { crate = "syn@2.0.119", reason = "ICU's synstructure/yoke derive chain requires syn 2 while other current derive dependencies require syn 3" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17.14, used by reqwest's Rustls provider, requires windows-sys 0.52" },
]
