[tasks.normalize]
description = "Normalize files of Cloud storage"
usage = '''
arg "<project>" help="Google Cloud project"
arg "<bucket>" help="Cloud Storage bucket"
'''
run = '''
set -eu
if [ -f /.dockerenv ]; then
    task-googlecloud normalize "${usage_project?}" "${usage_bucket?}"
else
    trap 'docker compose down' EXIT
    docker compose build app
    docker compose run --rm app task-googlecloud normalize "${usage_project?}" "${usage_bucket?}"
fi
'''

[tasks.upload]
description = "Upload files to Cloud storage"
usage = '''
arg "<project>" help="Google Cloud project"
'''
run = '''
set -eu
if [ -f /.dockerenv ]; then
    task-googlecloud upload "${usage_project?}"
else
    trap 'docker compose down' EXIT
    docker compose build app
    docker compose run --rm app task-googlecloud upload "${usage_project?}"
fi
'''

[tasks.fmt]
description = "Format Rust source"
run = '''
set -eu
if [ -f /.dockerenv ]; then
    cargo fmt --all
else
    docker compose build app
    docker compose run --rm --no-deps app cargo fmt --all
fi
'''

[tasks.fmt-check]
description = "Check Rust formatting"
run = '''
set -eu
if [ -f /.dockerenv ]; then
    cargo fmt --all -- --check
else
    docker compose build app
    docker compose run --rm --no-deps app cargo fmt --all -- --check
fi
'''

[tasks.clippy]
description = "Run Clippy with warnings denied"
run = '''
set -eu
if [ -f /.dockerenv ]; then
    cargo clippy --all-targets --locked -- -D warnings
else
    docker compose build app
    docker compose run --rm --no-deps app cargo clippy --all-targets --locked -- -D warnings
fi
'''

[tasks.markdownlint]
description = "Run markdownlint-cli2"
run = '''
set -eu
if [ -f /.dockerenv ]; then
    markdownlint-cli2 --config .markdownlint-cli2.jsonc
else
    docker compose build app
    docker compose run --rm --no-deps app markdownlint-cli2 --config .markdownlint-cli2.jsonc
fi
'''

[tasks.test]
description = "Run Rust tests"
run = '''
set -eu
if [ -f /.dockerenv ]; then
    cargo test --all-targets --locked
else
    docker compose build app
    docker compose run --rm --no-deps app cargo test --all-targets --locked
fi
'''
